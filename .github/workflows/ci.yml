name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install
        run: npm ci --prefix server && npm ci --prefix client
      - name: Lint
        run: npm run lint
      - name: Test (Vitest + Supertest, embedded MongoDB)
        run: npm test
      - name: Build client
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rtf-india:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
